name: Markdown integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-markdown:
    name: Check generated documentation
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Test Markdown generator
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -B -m unittest discover -s .python/tests -p "test_*.py" -v

      - name: Validate localized Markdown artifacts
        shell: cmd
        run: .python\check_markdown.bat
